theme = "ayu_dark"

[editor]
mouse = false
bufferline = "multiple"

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.inline-diagnostics]
cursor-line = "error"

[keys.normal]
C-g = [
    ":write-all",
    ":insert-output lazygit >/dev/tty",
    ":redraw",
    ":reload-all"
]
"A-[" = "goto_previous_buffer"
"A-]" = "goto_next_buffer"


[editor.statusline]
right = [
    "file-type",
    "separator",
    "file-name",
    "separator",
    "spacer",
    "version-control",
    "spacer",
    "separator",
    "file-modification-indicator",
]
left = [
    "mode",
    "selections",
    "primary-selection-length",
    "separator",
    "position",
    "position-percentage",
]

[editor.statusline.mode]
insert = "INSERT"
normal = "NORMAL"
select = "SELECT"
