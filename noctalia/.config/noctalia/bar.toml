# ───────── Bar layout ─────────
[bar.default]
position = "top"
widget_spacing = 8

capsule = true
capsule_fill = "surface_container"
capsule_opacity = 0.85
capsule_padding = 8
capsule_radius = 16


start  = ["arch", "workspaces", "group:system"]
center = ["clock", "weather", "ai_usage" ]
end    = ["media", "tray", "battery", "network", "wallhaven"]

# ───────── Left ─────────
[widget.arch]
type = "launcher"                                   # click opens the launcher
custom_image = "~/.config/noctalia/logo.svg"        # any Arch logo image


[widget.workspaces]
style = "regular"               # regular | minimal | focus_hint

show_labels = true              # Show workspace labels
label_source = "id"             # id | name

focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_container"

pill_scale = 1.0
active_pill_size = 2.2
inactive_pill_size = 1.0

hide_when_empty = false
show_tooltip = true

[[bar.default.capsule_group]]
id = "system"
members = ["cpu", "ram"]
fill = "surface_container"
padding = 10
opacity = 0.85
widget_spacing = 12
enabled = true


# ───────── Center ─────────

[widget.ai_usage]
type = "felipeartur/ai-usagebar:bar"
visualization = "gauge"
provider_limit = 2
quota_window = "weekly"
auto_providers = [ "openai", "claude" ] 

[widget.clock]
format = "{:%a %d %b  %H:%M}"

[widget.weather]
max_length = 180
show_condition = true

# ───────── Right ─────────
[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.media]
min_length = 80
max_length = 240
art_size = 20
title_scroll = "on_hover"

[widget.tray]
drawer = true
drawer_columns = 3
drawer_item_size = 20
detached_panel = false
hide_passive = true
pinned =  []

[widget.battery]
device = "auto"

[widget.network]
show_label = true                                   # show SSID
# ───────── Weather / location ─────────
[weather]
enabled = true
unit = "metric"
refresh_minutes = 30

[location]
address = "Odesa, Ukraine"                          # or auto_locate = true
